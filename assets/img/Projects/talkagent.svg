<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#101524" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="200" cy="180" r="140" fill="#00f2fe" opacity="0.08" filter="url(#glow)"/>
  <circle cx="620" cy="320" r="160" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>

  <!-- Header Badge -->
  <g transform="translate(60, 45)">
    <rect width="180" height="34" rx="17" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#00f2fe"/>
    <text x="36" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#00f2fe">AI VOICE AGENT</text>
  </g>

  <g transform="translate(60, 115)">
    <text font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">TalkAgent</text>
    <text y="30" font-family="'Inter', sans-serif" font-size="16" fill="#94a3b8">Voice-Enabled Multi-Agent Customer Service</text>
  </g>

  <!-- LangGraph Architecture Diagram Mockup -->
  <!-- Main Workflow Card -->
  <g transform="translate(60, 180)">
    <rect width="680" height="260" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Waveform Visualizer -->
    <g transform="translate(40, 45)">
      <rect x="0" y="25" width="6" height="25" rx="3" fill="#00f2fe"/>
      <rect x="14" y="15" width="6" height="45" rx="3" fill="#00f2fe"/>
      <rect x="28" y="5" width="6" height="65" rx="3" fill="#38bdf8"/>
      <rect x="42" y="20" width="6" height="35" rx="3" fill="#38bdf8"/>
      <rect x="56" y="0" width="6" height="75" rx="3" fill="#818cf8"/>
      <rect x="70" y="18" width="6" height="40" rx="3" fill="#818cf8"/>
      <rect x="84" y="8" width="6" height="60" rx="3" fill="#a855f7"/>
      <rect x="98" y="22" width="6" height="30" rx="3" fill="#c084fc"/>
      <text x="120" y="44" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">ElevenLabs Voice I/O</text>
      <text x="120" y="64" font-family="'Inter', sans-serif" font-size="12" fill="#64748b">Real-time Bi-directional Audio Stream</text>
    </g>

    <!-- Node 1: Router -->
    <g transform="translate(40, 150)">
      <rect width="130" height="65" rx="10" fill="rgba(0, 242, 254, 0.08)" stroke="#00f2fe" stroke-width="1.5"/>
      <text x="65" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#00f2fe" text-anchor="middle">LangGraph</text>
      <text x="65" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Agent Router</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 180 182 L 215 182" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Node 2: Gemini Brain -->
    <g transform="translate(225, 150)">
      <rect width="130" height="65" rx="10" fill="rgba(139, 92, 246, 0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="65" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">Gemini LLM</text>
      <text x="65" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Reasoning & Tools</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 365 182 L 400 182" stroke="#64748b" stroke-width="2"/>

    <!-- Node 3: FAISS RAG -->
    <g transform="translate(410, 150)">
      <rect width="115" height="65" rx="10" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1.5"/>
      <text x="57" y="28" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">FAISS RAG</text>
      <text x="57" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">PDF Knowledge</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 535 182 L 560 182" stroke="#64748b" stroke-width="2"/>

    <!-- Node 4: CRM / Human -->
    <g transform="translate(570, 150)">
      <rect width="80" height="65" rx="10" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="40" y="28" font-family="'Outfit', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Escalation</text>
      <text x="40" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">CRM Tools</text>
    </g>

    <!-- Badges in top right -->
    <g transform="translate(460, 45)">
      <rect width="85" height="26" rx="13" fill="rgba(255,255,255,0.05)"/>
      <text x="42" y="17" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Gemini Pro</text>

      <rect x="95" y="0" width="105" height="26" rx="13" fill="rgba(255,255,255,0.05)"/>
      <text x="147" y="17" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SQLite CRM</text>
    </g>
  </g>
</svg>
